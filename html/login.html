<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — e4ds make</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-light">

  <div id="header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">

          <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
              <span class="fw-bold fs-3 text-dark">e</span><span class="fw-bold fs-3" style="color:var(--e4ds-orange)">4</span><span class="fw-bold fs-3 text-dark">ds</span>
              <span class="fs-5 text-secondary ms-1">make</span>
            </a>
            <p class="text-muted small mt-1">계정에 로그인하세요</p>
          </div>

          <div class="card border-0 shadow-sm rounded-4 p-4">
            <form id="login-form" novalidate>

              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-medium">이메일</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="example@email.com" required>
                <div class="invalid-feedback">올바른 이메일을 입력해주세요.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label fw-medium mb-0">비밀번호</label>
                  <a href="#" class="small text-primary text-decoration-none">비밀번호를 잊으셨나요?</a>
                </div>
                <div class="input-group">
                  <input type="password" class="form-control" id="loginPassword" placeholder="비밀번호 입력" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggleLoginPw">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
                <div class="invalid-feedback">비밀번호를 입력해주세요.</div>
              </div>

              <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">로그인 상태 유지</label>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold py-2">로그인</button>
            </form>

            <div class="d-flex align-items-center my-4">
              <hr class="flex-grow-1"><span class="mx-3 text-muted small">또는</span><hr class="flex-grow-1">
            </div>

            <button id="btn-kakao" class="btn w-100 d-flex align-items-center justify-content-center gap-2 fw-medium" type="button" style="background:#FEE500;border:1.5px solid #F0D800;">
              <svg width="18" height="18" viewBox="0 0 40 40"><path d="M20 4C11.163 4 4 9.818 4 17c0 4.628 2.93 8.686 7.364 11.11L9.6 35.2l7.73-5.12C18.42 30.352 19.2 30.4 20 30.4c8.837 0 16-5.818 16-13S28.837 4 20 4z" fill="#3A1D1D"/></svg>
              카카오로 로그인
            </button>
            <button id="btn-google" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google로 계속하기
            </button>
          </div>

          <p class="text-center text-muted small mt-4">
            아직 계정이 없으신가요?
            <a href="signup.html" class="text-primary fw-medium text-decoration-none">회원가입</a>
          </p>

        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX5jFRcDBz3XBrTk4ycr3n8UPn" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // If already logged in, redirect immediately
    if (Auth.isLoggedIn()) {
      var _ret = sessionStorage.getItem('make_return_url');
      sessionStorage.removeItem('make_return_url');
      window.location.href = _ret || 'index.html';
    }

    // Password show/hide
    $('#toggleLoginPw').on('click', function () {
      var inp = $('#loginPassword');
      inp.attr('type', inp.attr('type') === 'password' ? 'text' : 'password');
    });

    // Social login buttons
    $('#btn-kakao').on('click', function () { _doSocialLogin('kakao', '카카오유저'); });
    $('#btn-google').on('click', function () { _doSocialLogin('google', '구글유저'); });

    function _doSocialLogin(provider, name) {
      Auth.login({ email: provider + '@demo.com', name: name });
      _redirect();
    }

    // Email login
    $('#login-form').on('submit', function (e) {
      e.preventDefault();
      if (!this.checkValidity()) { $(this).addClass('was-validated'); return; }
      var email = $('#loginEmail').val().trim();
      Auth.login({ email: email, name: email.split('@')[0] });
      _redirect();
    });

    function _redirect() {
      var ret = sessionStorage.getItem('make_return_url');
      sessionStorage.removeItem('make_return_url');
      window.location.href = ret || 'index.html';
    }
  </script>
</body>
</html>
