<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문의하기 — e4ds make</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-light">
  <div id="header-placeholder"></div>
  <main>
    <div class="bg-white border-bottom">
      <div class="container-xl py-3">
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">홈</a></li>
          <li class="breadcrumb-item active">문의하기</li>
        </ol></nav>
      </div>
    </div>

    <div class="container-xl py-5">
      <div class="row g-5">
        <div class="col-lg-5">
          <h2 class="fw-bold mb-2">문의하기</h2>
          <p class="text-muted mb-4">궁금한 점이나 불편 사항이 있으시면 편하게 문의해주세요. 영업일 기준 24시간 이내에 답변드립니다.</p>
          <div class="d-flex flex-column gap-3">
            <div class="d-flex align-items-start gap-3">
              <div class="bg-primary-subtle rounded-3 p-3 text-primary">📧</div>
              <div><div class="fw-semibold">이메일</div><div class="text-muted small">contact@e4ds.com</div></div>
            </div>
            <div class="d-flex align-items-start gap-3">
              <div class="bg-success-subtle rounded-3 p-3 text-success">📞</div>
              <div><div class="fw-semibold">전화</div><div class="text-muted small">02-883-9797 (평일 09:00–18:00)</div></div>
            </div>
            <div class="d-flex align-items-start gap-3">
              <div class="bg-warning-subtle rounded-3 p-3 text-warning-emphasis">📍</div>
              <div><div class="fw-semibold">주소</div><div class="text-muted small">경기도 성남시 분당구 대왕판교로 660번길 8</div></div>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card border-0 shadow-sm rounded-4 p-4">
            <form id="contact-form" novalidate>
              <div class="row g-3 mb-3">
                <div class="col-sm-6">
                  <label class="form-label fw-medium">이름 <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" required placeholder="홍길동">
                  <div class="invalid-feedback">이름을 입력해주세요.</div>
                </div>
                <div class="col-sm-6">
                  <label class="form-label fw-medium">이메일 <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" required placeholder="example@email.com">
                  <div class="invalid-feedback">올바른 이메일을 입력해주세요.</div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-medium">문의 유형</label>
                <select class="form-select">
                  <option>일반 문의</option>
                  <option>콘테스트 문의</option>
                  <option>기술 지원</option>
                  <option>광고/스폰서십</option>
                  <option>기타</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-medium">제목 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" required placeholder="문의 제목">
                <div class="invalid-feedback">제목을 입력해주세요.</div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-medium">내용 <span class="text-danger">*</span></label>
                <textarea class="form-control" rows="6" required placeholder="문의 내용을 상세히 작성해주세요."></textarea>
                <div class="invalid-feedback">내용을 입력해주세요.</div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-medium">파일 첨부 <span class="text-muted small">(선택)</span></label>
                <input type="file" class="form-control">
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">문의 보내기</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX5jFRcDBz3XBrTk4ycr3n8UPn" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script>
    $('#contact-form').on('submit', function(e){
      e.preventDefault();
      if(!this.checkValidity()){ $(this).addClass('was-validated'); return; }
      alert('문의가 접수되었습니다. 영업일 24시간 이내에 답변 드리겠습니다.');
      this.reset(); $(this).removeClass('was-validated');
    });
  </script>
</body>
</html>
