<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 — e4ds make</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-light">
  <div id="header-placeholder"></div>
  <main>
    <div class="bg-white border-bottom">
      <div class="container-xl py-3">
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">홈</a></li>
          <li class="breadcrumb-item active">이벤트</li>
        </ol></nav>
      </div>
    </div>

    <section style="background:linear-gradient(135deg,#2563eb,#7c3aed)" class="text-white py-5">
      <div class="container-xl text-center py-3">
        <span class="badge bg-white bg-opacity-25 rounded-pill px-3 py-2 mb-4 fs-6">✨ Make 2.0 이벤트</span>
        <h1 class="fw-bold display-5 mb-3">메이커 커뮤니티 이벤트</h1>
        <p class="fs-5 text-white-50">워크숍, 밋업, 해커톤 등 다양한 오프라인/온라인 이벤트에 참여하세요</p>
      </div>
    </section>

    <div class="container-xl py-5">
      <h4 class="fw-bold mb-1">다가오는 이벤트</h4>
      <p class="text-muted mb-4">메이커들과 함께 배우고 성장하는 시간</p>
      <div class="row g-4" id="events-grid">
        <!-- rendered by JS -->
      </div>

      <h4 class="fw-bold mt-5 mb-1">지난 이벤트</h4>
      <p class="text-muted mb-4">지난 이벤트 하이라이트를 확인해보세요</p>
      <div class="row g-4">
        <div class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm h-100 opacity-75">
            <img src="https://images.unsplash.com/photo-1553408226-42ecf81a214c?w=600" class="card-img-top" style="height:160px;object-fit:cover;" alt="">
            <div class="card-body p-4">
              <span class="badge bg-secondary mb-2">종료</span>
              <h6 class="fw-bold">임베디드 입문 워크숍</h6>
              <p class="small text-muted">2026년 2월 15일 · 온라인</p>
              <p class="small text-muted mb-0">아두이노로 배우는 임베디드 시스템 기초 — 참가자 120명</p>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-lg-4">
          <div class="card border-0 shadow-sm h-100 opacity-75">
            <img src="https://images.unsplash.com/photo-1628206554160-63e8c921e398?w=600" class="card-img-top" style="height:160px;object-fit:cover;" alt="">
            <div class="card-body p-4">
              <span class="badge bg-secondary mb-2">종료</span>
              <h6 class="fw-bold">에너지 해커톤 2026</h6>
              <p class="small text-muted">2026년 1월 20일 · 서울</p>
              <p class="small text-muted mb-0">재생에너지 혁신 아이디어 경진 — 참가팀 45팀</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX5jFRcDBz3XBrTk4ycr3n8UPn" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script>
  var events = [
    { title:'AI 로봇공학 워크숍', date:'2026년 3월 25일', time:'14:00–18:00', location:'서울 강남구 테헤란로', participants:45, max:50, type:'워크숍', status:'모집중', img:'https://images.unsplash.com/photo-1581092333203-42374bcf7d89?w=600' },
    { title:'메이커 밋업: 3D 프린팅', date:'2026년 4월 5일', time:'13:00–17:00', location:'성남 판교 e4ds 본사', participants:23, max:30, type:'밋업', status:'모집중', img:'https://images.unsplash.com/photo-1703221561813-cdaa308cf9e7?w=600' },
    { title:'IoT 해커톤 2026', date:'2026년 4월 19일–20일', time:'종일', location:'온라인', participants:88, max:200, type:'해커톤', status:'모집중', img:'https://images.unsplash.com/photo-1753039495488-434a2fe53e41?w=600' },
    { title:'드론 기술 세미나', date:'2026년 5월 8일', time:'10:00–12:00', location:'온라인 웨비나', participants:210, max:500, type:'웨비나', status:'모집중', img:'https://images.unsplash.com/photo-1473968512647-3e447244af8f?w=600' },
  ];
  var typeColors = { 워크숍:'primary', 밋업:'success', 해커톤:'danger', 웨비나:'info' };
  $('#events-grid').html(events.map(function(e){
    var pct = Math.round(e.participants/e.max*100);
    return '<div class="col-md-6 col-lg-4"><div class="card border-0 shadow-sm h-100">'
      +'<img src="'+e.img+'" class="card-img-top" style="height:160px;object-fit:cover;" alt="">'
      +'<div class="card-body p-4">'
      +'<div class="d-flex gap-2 mb-2"><span class="badge bg-'+typeColors[e.type]+'-subtle text-'+typeColors[e.type]+'">'+e.type+'</span><span class="badge bg-success">'+e.status+'</span></div>'
      +'<h6 class="fw-bold mb-2">'+e.title+'</h6>'
      +'<div class="small text-muted mb-1">📅 '+e.date+'</div>'
      +'<div class="small text-muted mb-1">🕐 '+e.time+'</div>'
      +'<div class="small text-muted mb-3">📍 '+e.location+'</div>'
      +'<div class="d-flex justify-content-between small text-muted mb-1"><span>참가 현황</span><span>'+e.participants+'/'+e.max+'명</span></div>'
      +'<div class="progress mb-3" style="height:6px"><div class="progress-bar bg-primary" style="width:'+pct+'%"></div></div>'
      +'</div>'
      +'<div class="card-footer bg-transparent border-0 px-4 pb-4"><button class="btn btn-primary btn-sm w-100">신청하기</button></div>'
      +'</div></div>';
  }).join(''));
  </script>
</body>
</html>
