  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<body class="bg-light">
  <div id="header-placeholder"></div>
  <main>
    <div class="bg-white border-bottom">
      <div class="container-xl py-3">
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">

    <div class="container-xl py-5">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <h2 class="fw-bold mb-4">공지사항</h2>

          <!-- Search -->
          <div class="input-group mb-4">
            <span class="input-group-text bg-white"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>

  <script src="assets/js/main.js"></script>
  <script>
  var notices = [
    { id:1, title:'[중요] Make 2.0 플랫폼 서비스 약관 업데이트 안내', date:'2026.03.18', type:'중요', pinned:true },

  $('#notice-list').html(notices.map(function(n){
    return '<a href="#" class="list-group-item list-group-item-action border-0 border-bottom py-3 px-4 d-flex align-items-center gap-3">'
      +(n.pinned?'<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#ef4444" class="flex-shrink-0"><path d="M12 2l1.5 5h5.5l-4.5 3.5 1.5 5-4-3-4 3 1.5-5L5 7h5.5z"/></svg>':'<div style="width:14px"></div>')
