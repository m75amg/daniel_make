<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로젝트 — e4ds make</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
  <style>
    .project-card { cursor:pointer; transition: transform .2s, box-shadow .2s; }
    .project-card:hover { transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(0,0,0,.12)!important; }
    .project-card .card-img-top { height:180px; object-fit:cover; }
    .filter-btn.active { background: #2563eb; color:#fff; border-color:#2563eb; }
    .progress { height: 6px; }
  </style>
</head>
<body class="bg-light">

  <div id="header-placeholder"></div>

  <main>
    <!-- Breadcrumb -->
    <div class="bg-white border-bottom">
      <div class="container-xl py-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0 small">
            <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">홈</a></li>
            <li class="breadcrumb-item active">프로젝트</li>
          </ol>
        </nav>
      </div>
    </div>

    <!-- Hero -->
    <section class="bg-white border-bottom py-5">
      <div class="container-xl">
        <div class="text-center mb-4">
          <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-3 fs-6">
            📈 2,341개의 프로젝트
          </span>
          <h1 class="fw-bold display-6">메이커들의 프로젝트</h1>
          <p class="text-muted fs-5">전 세계 메이커들이 만들고 공유하는 혁신적인 프로젝트를 둘러보세요</p>
        </div>
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="input-group input-group-lg">
              <span class="input-group-text bg-white"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
              <input type="text" class="form-control border-start-0" id="project-search" placeholder="프로젝트 검색...">
              <button class="btn btn-outline-secondary" type="button">필터</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main -->
    <div class="container-xl py-5">
      <div class="row g-4">

        <!-- Sidebar -->
        <div class="col-lg-3">
          <div class="card border-0 shadow-sm p-4 sticky-top" style="top:110px;">
            <h6 class="fw-bold mb-3">카테고리</h6>
            <div class="list-group list-group-flush" id="category-list">
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded active-cat" data-cat="전체">전체 <span class="badge bg-primary rounded-pill">2341</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="로봇공학">로봇공학 <span class="badge bg-secondary rounded-pill">456</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="IoT">IoT <span class="badge bg-secondary rounded-pill">678</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="AI">AI <span class="badge bg-secondary rounded-pill">432</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="3D프린팅">3D프린팅 <span class="badge bg-secondary rounded-pill">289</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="웨어러블">웨어러블 <span class="badge bg-secondary rounded-pill">234</span></button>
              <button class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-2 border-0 rounded" data-cat="드론">드론 <span class="badge bg-secondary rounded-pill">198</span></button>
            </div>
            <hr>
            <h6 class="fw-bold mb-2">정렬</h6>
            <select class="form-select form-select-sm" id="sort-select">
              <option>인기순</option>
              <option>최신순</option>
              <option>조회순</option>
              <option>좋아요순</option>
            </select>
          </div>
        </div>

        <!-- Project Grid -->
        <div class="col-lg-9">
          <!-- Filter Tabs -->
          <div class="d-flex flex-wrap gap-2 mb-4 bg-white p-2 rounded-3 shadow-sm">
            <button class="btn btn-sm filter-btn active" data-filter="all">전체 <span class="badge bg-secondary ms-1">6</span></button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="personal">개인 프로젝트 <span class="badge bg-secondary ms-1">3</span></button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="contest">🏆 콘테스트 <span class="badge bg-secondary ms-1">3</span></button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="in-progress">⏳ 진행중 <span class="badge bg-secondary ms-1">2</span></button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="completed">✅ 완료 <span class="badge bg-secondary ms-1">3</span></button>
            <button class="btn btn-sm btn-outline-secondary filter-btn" data-filter="award">🏅 수상작 <span class="badge bg-secondary ms-1">2</span></button>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0" id="list-title">전체 프로젝트</h5>
            <small class="text-muted" id="list-count">6개의 결과</small>
          </div>

          <div class="row g-4" id="project-grid">
            <!-- Cards rendered by JS -->
          </div>

          <div class="text-center mt-5" id="load-more-wrap">
            <button class="btn btn-outline-primary btn-lg px-5" id="load-more-btn">
              더 많은 프로젝트 보기
            </button>
            <p class="text-muted small mt-2" id="load-more-count"></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX5jFRcDBz3XBrTk4ycr3n8UPn" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script>
  var projects = [
    { id:1, title:'AI 음성인식 자율주행 로봇', desc:'라즈베리파이와 OpenCV로 실내 자율주행이 가능한 배송 로봇. Quest 3까지 완료하여 최우수상 수상', author:'김메이커', authorId:'kimmaker', category:'로봇공학', likes:567, views:8930, comments:142, type:'contest', status:'completed', award:'최우수상', quest:{done:3,total:3}, img:'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600' },
    { id:2, title:'오픈소스 자율주행 로봇', desc:'라즈베리파이와 AI 비전을 활용한 실내 자율주행 로봇 프로젝트. Quest 2 진행중', author:'김메이커', authorId:'kimmaker', category:'로봇공학', likes:432, views:5420, comments:89, type:'contest', status:'in-progress', quest:{done:2,total:3}, img:'https://images.unsplash.com/photo-1581092333203-42374bcf7d89?w=600' },
    { id:3, title:'ESP32 기반 스마트 화분', desc:'토양 수분, 온도, 조도를 모니터링하고 자동으로 물을 주는 IoT 화분', author:'이개발', authorId:'leedev', category:'IoT', likes:289, views:3210, comments:54, type:'personal', status:'completed', img:'https://images.unsplash.com/photo-1753039495488-434a2fe53e41?w=600' },
    { id:4, title:'3D 프린터 자동 레벨링 시스템', desc:'AI 기반 자동 베드 레벨링으로 완벽한 첫 레이어를 만드는 시스템', author:'박엔지니어', authorId:'parkengineer', category:'3D프린팅', likes:267, views:2890, comments:41, type:'personal', status:'in-progress', img:'https://images.unsplash.com/photo-1703221561813-cdaa308cf9e7?w=600' },
    { id:5, title:'AI 음성인식 스마트 미러', desc:'거울에 날씨, 일정, 뉴스를 표시하고 음성으로 제어하는 스마트홈 디스플레이', author:'최개발', authorId:'choidev', category:'AI', likes:345, views:4120, comments:67, type:'contest', status:'completed', award:'우수상', quest:{done:3,total:3}, img:'https://images.unsplash.com/photo-1758525747606-bd5d801ca87b?w=600' },
    { id:6, title:'아두이노 기반 날씨 관측소', desc:'온습도, 기압, 풍향풍속을 측정하고 실시간으로 데이터를 시각화하는 관측 시스템', author:'정코더', authorId:'jungcoder', category:'IoT', likes:45, views:234, comments:8, type:'personal', status:'draft', img:'https://images.unsplash.com/photo-1553408226-42ecf81a214c?w=600' }
  ];

  var PAGE = 6, visible = 6, currentFilter = 'all', currentCategory = 'all';

  function statusBadge(p){
    if(p.status==='draft') return '<span class="badge bg-secondary">초안</span>';
    if(p.status==='in-progress') return '<span class="badge bg-warning text-dark">진행중</span>';
    if(p.status==='completed') return '<span class="badge bg-success">완료</span>';
    return '';
  }
  function questBar(p){
    if(!p.quest) return '';
    var pct = Math.round(p.quest.done/p.quest.total*100);
    var cls = p.status==='completed'?'bg-success':'bg-warning';
    return '<div class="mb-3 p-2 rounded-2 border '+(p.status==='completed'?'bg-success-subtle border-success-subtle':'bg-warning-subtle border-warning-subtle')+'">'
      +'<div class="d-flex justify-content-between small fw-semibold mb-1">'
      +(p.status==='completed'?'<span>✅ 콘테스트 완료</span>':'<span>⏳ 진행중</span>')
      +'<span>Quest '+p.quest.done+'/'+p.quest.total+'</span></div>'
      +'<div class="progress"><div class="progress-bar '+cls+'" style="width:'+pct+'%"></div></div>'
      +'</div>';
  }
  function renderCard(p){
    return '<div class="col-md-6 project-item" data-type="'+p.type+'" data-status="'+p.status+'" data-award="'+(p.award?'yes':'')+'">'
      +'<div class="card border-0 shadow-sm h-100 project-card" onclick="window.location=\'project-detail.html?id='+p.id+'\'">'
      +'<div class="position-relative overflow-hidden" style="height:180px">'
      +'<img src="'+p.img+'" alt="" class="w-100 h-100 object-fit-cover">'
      +'<div class="position-absolute top-0 start-0 m-2 d-flex flex-wrap gap-1">'
      +'<span class="badge bg-light text-dark">'+p.category+'</span>'
      +statusBadge(p)
      +(p.award?'<span class="badge bg-warning text-dark">🏆 '+p.award+'</span>':'')
      +(p.type==='contest'?'<span class="badge bg-purple text-white" style="background:#7c3aed">🏆 콘테스트</span>':'')
      +'</div></div>'
      +'<div class="card-body">'
      +questBar(p)
      +'<h6 class="fw-bold mb-1">'+p.title+'</h6>'
      +'<p class="text-muted small mb-3" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+p.desc+'</p>'
      +'<div class="d-flex align-items-center justify-content-between">'
      +'<a href="maker-profile.html?id='+p.authorId+'" class="text-decoration-none text-dark small d-flex align-items-center gap-2" onclick="event.stopPropagation()">'
      +'<span class="badge bg-primary-subtle text-primary rounded-circle p-2">'+p.author[0]+'</span>'+p.author+'</a>'
      +'<div class="d-flex gap-2 text-muted small"><span>❤️ '+p.likes+'</span><span>👁 '+p.views+'</span><span>💬 '+p.comments+'</span></div>'
      +'</div></div></div></div>';
  }
  function filtered(){
    return projects.filter(function(p){
      var passFilter = true;
      if(currentFilter==='personal') passFilter = p.type==='personal';
      else if(currentFilter==='contest') passFilter = p.type==='contest';
      else if(currentFilter==='in-progress') passFilter = p.status==='in-progress';
      else if(currentFilter==='completed') passFilter = p.status==='completed';
      else if(currentFilter==='award') passFilter = !!p.award;
      var passCat = (currentCategory==='all' || p.category===currentCategory);
      return passFilter && passCat;
    });
  }
  function render(){
    var list = filtered();
    var shown = list.slice(0, visible);
    var html = shown.map(renderCard).join('');
    if(!html) html = '<div class="col-12 text-center py-5 text-muted">해당하는 프로젝트가 없습니다.</div>';
    $('#project-grid').html(html);
    $('#list-count').text(list.length+'개의 결과');
    if(visible >= list.length){
      $('#load-more-wrap').hide();
    } else {
      $('#load-more-wrap').show();
      $('#load-more-count').text(visible+'개 / 총 '+list.length+'개');
    }
  }

  $(function(){
    render();
    $('.filter-btn').on('click', function(){
      $('.filter-btn').removeClass('active').addClass('btn-outline-secondary').removeClass('btn-primary');
      $(this).addClass('active').removeClass('btn-outline-secondary');
      currentFilter = $(this).data('filter');
      visible = PAGE;
      render();
    });
    $('#load-more-btn').on('click', function(){ visible += PAGE; render(); });
    $('#project-search').on('input', function(){
      var q = $(this).val().toLowerCase();
      $('.project-item').each(function(){
        var title = $(this).find('h6').text().toLowerCase();
        $(this).toggle(title.includes(q));
      });
    });
    $('#category-list button').on('click', function(){
      $('#category-list button').removeClass('active-cat text-primary fw-semibold');
      $(this).addClass('active-cat text-primary fw-semibold');
      var cat = $(this).data('cat');
      currentCategory = (cat === '전체') ? 'all' : cat;
      visible = PAGE;
      render();
    });

    $('#sort-select').on('change', function(){
      var sort = $(this).val();
      if(sort==='인기순') projects.sort(function(a,b){ return b.likes-a.likes; });
      else if(sort==='최신순') projects.sort(function(a,b){ return b.id-a.id; });
      else if(sort==='조회순') projects.sort(function(a,b){ return b.views-a.views; });
      visible = PAGE;
      render();
    });
  });
  </script>
</body>
</html>
