<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채용 — e4ds make</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="bg-light">
  <div id="header-placeholder"></div>
  <main>
    <div class="bg-white border-bottom">
      <div class="container-xl py-3">
        <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">홈</a></li>
          <li class="breadcrumb-item active">채용</li>
        </ol></nav>
      </div>
    </div>

    <section class="bg-dark text-white py-5">
      <div class="container-xl py-3 text-center">
        <h1 class="fw-bold display-5 mb-3">함께 만들어가요</h1>
        <p class="fs-5 text-white-50 mb-4">메이커 생태계를 만들어가는 e4ds에서 함께 성장할 동료를 찾습니다</p>
        <div class="d-flex flex-wrap justify-content-center gap-4 text-center">
          <div><div class="fw-bold fs-4" style="color:var(--e4ds-orange)">15년+</div><small>업력</small></div>
          <div><div class="fw-bold fs-4" style="color:var(--e4ds-orange)">80+</div><small>임직원</small></div>
          <div><div class="fw-bold fs-4" style="color:var(--e4ds-orange)">45+</div><small>파트너사</small></div>
        </div>
      </div>
    </section>

    <div class="container-xl py-5">
      <!-- Culture -->
      <h3 class="fw-bold text-center mb-2">우리의 문화</h3>
      <p class="text-muted text-center mb-5">e4ds에서의 삶</p>
      <div class="row g-4 mb-5">
        <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100"><div class="fs-1 mb-2">🚀</div><h6 class="fw-bold">도전정신</h6><p class="text-muted small mb-0">새로운 기술과 아이디어를 두려워하지 않습니다</p></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100"><div class="fs-1 mb-2">🤝</div><h6 class="fw-bold">협업</h6><p class="text-muted small mb-0">팀으로 함께 문제를 해결하는 문화를 지향합니다</p></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100"><div class="fs-1 mb-2">🌱</div><h6 class="fw-bold">성장</h6><p class="text-muted small mb-0">개인의 성장이 회사의 성장으로 이어집니다</p></div></div>
        <div class="col-md-3"><div class="card border-0 shadow-sm rounded-4 p-4 text-center h-100"><div class="fs-1 mb-2">⚖️</div><h6 class="fw-bold">워라밸</h6><p class="text-muted small mb-0">삶과 일의 균형을 지원합니다</p></div></div>
      </div>

      <!-- Job Openings -->
      <h3 class="fw-bold mb-4">채용 공고</h3>
      <div class="row g-4" id="jobs-list"></div>

      <div class="card border-0 shadow-sm rounded-4 p-5 mt-5 text-center">
        <h4 class="fw-bold mb-2">원하는 포지션이 없나요?</h4>
        <p class="text-muted mb-3">열정 있는 분이라면 언제든지 지원해주세요!</p>
        <a href="contact.html" class="btn btn-primary px-5">이메일로 문의하기</a>
      </div>
    </div>
  </main>
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmX5jFRcDBz3XBrTk4ycr3n8UPn" crossorigin="anonymous"></script>
  <script src="assets/js/main.js"></script>
  <script>
  var jobs = [
    { title:'프론트엔드 개발자', team:'개발팀', type:'정규직', location:'성남 (하이브리드)', tags:['React','TypeScript','Bootstrap'], desc:'Make 2.0 플랫폼의 UI/UX를 개발하고 개선합니다.' },
    { title:'백엔드 개발자', team:'개발팀', type:'정규직', location:'성남 (하이브리드)', tags:['Node.js','AWS','PostgreSQL'], desc:'플랫폼의 API 서버와 데이터 파이프라인을 설계하고 구축합니다.' },
    { title:'콘텐츠 마케터', team:'마케팅팀', type:'정규직', location:'성남 (온사이트)', tags:['SNS','컨텐츠기획','영상'], desc:'메이커 커뮤니티를 위한 콘텐츠를 기획하고 제작합니다.' },
    { title:'이벤트 기획자', team:'커뮤니티팀', type:'계약직', location:'성남 / 원격', tags:['이벤트기획','커뮤니티','진행'], desc:'워크숍, 해커톤 등 오프라인/온라인 이벤트를 기획하고 운영합니다.' },
  ];
  var typeColors = { 정규직:'primary', 계약직:'warning' };
  $('#jobs-list').html(jobs.map(function(j){
    return '<div class="col-md-6"><div class="card border-0 shadow-sm rounded-4 p-4 h-100">'
      +'<div class="d-flex justify-content-between align-items-start mb-3">'
      +'<div><h5 class="fw-bold mb-1">'+j.title+'</h5><small class="text-muted">'+j.team+' · '+j.location+'</small></div>'
      +'<span class="badge bg-'+( typeColors[j.type]||'secondary')+'-subtle text-'+(typeColors[j.type]||'secondary')+'">'+j.type+'</span>'
      +'</div>'
      +'<p class="text-muted small mb-3">'+j.desc+'</p>'
      +'<div class="d-flex flex-wrap gap-1 mb-3">'+j.tags.map(function(t){ return '<span class="badge bg-light text-secondary border">#'+t+'</span>'; }).join('')+'</div>'
      +'<a href="contact.html" class="btn btn-outline-primary btn-sm">지원하기</a>'
      +'</div></div>';
  }).join(''));
  </script>
</body>
</html>
